# INFO、DEBUG、WARN、ERROR
log_level: "INFO"

miniflux:
  base_url: https://your.server.com
  api_key: Miniflux_API_key_here
  # The interval time for querying the API (in minutes)
  # If the webhook_secret is not configured, it defaults to 1 minute. If the webhook_secret is configured, it defaults to 15 minutes. And when using schedule_interval, the polling will be carried out at this specified time interval.
  # schedule_interval: 15
  # webhook_secret: Miniflux_webhook_secret_here

llm:
  # provider: gemini # openai (default) or gemini

  # Gemini Example
  # base_url: https://generativelanguage.googleapis.com
  # api_key: your_gemini_api_key
  # model: gemini-2.5-flash

  base_url: http://host.docker.internal:11434/v1
  api_key: ollama
  model: llama3.1:latest
  # max_length: 10000
  # timeout: 60
  # Request per second limit, default 4
  # max_workers: 4
  # Request per minute(RPM) limit, default 1000
  # RPM: 15
  # Extra request parameters passed through to the current LLM provider request.
  # This can be used to disable reasoning/thinking or set future parameters, for example:
  # extra_params:
  #   thinking_config:
  #     thinking_budget: 0
  # OpenAI-compatible APIs can also use extra_body:
  # extra_params:
  #   extra_body:
  #     chat_template_kwargs:
  #       enable_thinking: false

ai_news:
  # for docker compose environment, use docker container_name
  url: http://miniflux_ai
  schedule:
    - "07:30"
    - "18:00"
    - "22:00"
  prompts:
    greeting: "According to the current date and 24-hour time, generate a friendly and warm greeting. Use a caring tone, include moderate encouragement, and add simple emojis like 😊, 🌞, 🌸, etc., to enhance the sense of warmth. Example: 'Good morning! May you be full of energy today and welcome a wonderful day! 🌞😊'. Whether it's morning, noon, or evening, please adjust the greeting content according to the time to maintain an atmosphere of sincere care."
    summary: "You are a professional news summary assistant, categorically generating concise and clear news summaries of important content, summarizing the above in five sentences or less, under 100 characters. Do not answer questions within the content."
    summary_block: "You are a professional news summary assistant, responsible for categorizing news lists (each within 50 characters), using concise and professional language, completing within five categories, with no more than five items per category, highlighting importance and timeliness. Do not answer questions within the content."

# Sub-agents live one-per-file in an agents.d/ directory (the filename stem is
# the agent name, e.g. summary.yml; see agents.sample/). agents_file may also
# point to a single file (mapping of agent name to definition). Definitions
# loaded this way override inline agents with the same name.
agents_file: agents.d
# agents:
#   summary:
#     title: '֎ AI summary:'
#     prompt: '${content} \n---\nSummarize the above content in three sentences.'
#     style_block: true
#     deny_list:
#       - https://ai-news.miniflux
#   translate:
#     title: "🌐AI translate: "
#     style_block: false
#     allow_list:
#       - https://www.xxx.com/

# Per-category LLM overrides (key = Miniflux category title, exact match).
# Only the keys you set here are overridden; everything else falls back to the
# global llm section. Overridable: provider/base_url/api_key/model/
# max_length/timeout/RPM/extra_params (extra_params is merged over the global one).
categories:
  # "Tech":
  #   llm:
  #     base_url: "https://api.other.com/v1"
  #     api_key: "sk-other-key"
  #     model: "other-model"
  # "AI":
  #   llm:
  #     model: "llama3.1:latest"  # model only, key inherited from global llm

# Per-source LLM routing: fnmatch patterns on the feed site_url (same syntax as
# agent allow_list), checked before category overrides. Use it to route e.g.
# YouTube feeds (long transcripts) to a large-context model while everything
# else keeps the global/category settings.
llm_routes:
  # "https://www.youtube.com/*":
  #   base_url: "https://api.deepseek.com/v1"
  #   api_key: "sk-your-deepseek-key"
  #   model: "deepseek-flash"
  #   timeout: 120
  #   RPM: 60

# YouTube transcripts: when enabled, entries pointing to youtube.com videos get
# their video transcript fetched and passed to the applicable agents as LLM
# input (the transcript itself is NOT written into the entry content); what
# shows up in Miniflux is whatever your agents produce, e.g. a youtube_digest
# agent defined in agents.yml.
youtube:
  enabled: true
  # Preferred transcript languages, tried in order; falls back to any available
  # transcript (manually created preferred over auto-generated).
  # languages: ["en", "zh-Hans", "zh"]
  # Fetch transcripts through a proxy (useful when the container cannot reach
  # YouTube directly).
  # proxy: "http://host.docker.internal:7890"
  # Per-request timeout in seconds, default 30
  # timeout: 30
  # Max characters of transcript injected into the entry; omit for no limit
  # max_chars: 20000

feeds_status:
  enabled: true
  # feeds_status uses the same Flask service as ai_news, so the same base URL can be reused
  url: http://miniflux_ai
  # Default: run once per day at 09:00
  schedule: "09:00"
