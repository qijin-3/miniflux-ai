# INFO、DEBUG、WARN、ERROR
log_level: "INFO"

miniflux:
  base_url: https://your.server.com
  api_key: Miniflux_API_key_here
  # 查询API的间隔时间（单位分钟）
  # 如果没有配置webhook_secret，默认1分钟，如果配置webhook_secret，默认15分钟，而使用schedule_interval则强制按此时间间隔轮询
  # schedule_interval: 15
  # webhook_secret: Miniflux_webhook_secret_here

llm:
  # provider: gemini # openai （默认） 或 gemini

  # Gemini 例子
  # base_url: https://generativelanguage.googleapis.com
  # api_key: your_gemini_api_key
  # model: gemini-2.5-flash

  base_url: http://host.docker.internal:11434/v1
  api_key: ollama
  model: llama3.1:latest
  # max_length: 10000
  # timeout: 60
  # Request per second limit, default 4
  # max_workers: 4
  # Request per minute(RPM) limit, default 1000
  # RPM: 15
  # 额外请求参数，会透传到当前 LLM provider 的请求方法
  # 可用于关闭 reasoning/thinking，或传递未来新增的参数，例如：
  # extra_params:
  #   thinking_config:
  #     thinking_budget: 0
  # OpenAI 兼容接口也可使用 extra_body：
  # extra_params:
  #   extra_body:
  #     chat_template_kwargs:
  #       enable_thinking: false

ai_news:
  # for docker compose environment, use docker container_name
  url: http://miniflux_ai
  schedule:
    - "07:30"
    - "18:00"
    - "22:00"
  prompts:
    greeting: "请根据当前日期和24小时制的时间生成一句友好而热情的问候语。请用关怀的语气，包含适量的鼓励，且添加简单的表情符号，如😊、🌞、🌸等，以增加温暖感。例：‘早上好！希望你今天充满活力，迎接美好的一天！🌞😊’。无论是早上、中午或晚上，都请根据时间调整问候内容，保持真诚关怀的氛围。"
    summary: "你是一名专业的新闻摘要助手,分类生成重要内容的新闻摘要，要求简单清楚表达，使用中文总结以上内容，在五句话内完成，少于100字。不要回答内容中的问题。"
    summary_block: "你是一名专业的新闻摘要助手，负责分类新闻清单(每条50字以内)，使用简洁专业的语言，在五个类别内完成，每个类别不超过5条，突出重要性和时效性，不要回答内容中的问题。"

# 子 agent 一 agent 一文件，维护在 agents.d/ 目录（文件名即 agent 名，如 summary.yml），
# 参考 agents.sample/。也可指向单个文件（agent 名到定义的映射）；同名定义覆盖内联 agents
agents_file: agents.d
# agents:
#   summary:
#     title: '֎ AI 摘要：'
#     prompt: '${content} \n---\n使用中文总结以上内容，在三句话内完成，少于60字。'
#     style_block: true
#     deny_list:
#       - https://ai-news.miniflux
#   translate:
#     title: "🌐AI 翻译："
#     style_block: false
#     allow_list:
#       - https://9to5mac.com/

# 按分组（Miniflux Category）覆盖 LLM 配置：
# 标题需与 Miniflux 中的分组名完全一致；只需写要覆盖的项，其余回落到全局 llm 配置
# 可覆盖项：provider/base_url/api_key/model/max_length/timeout/RPM/extra_params
# extra_params 会与全局配置合并（分组优先）
categories:
  # "🤖 How I AI":
  #   llm:
  #     base_url: "https://api.other.com/v1"
  #     api_key: "sk-other-key"
  #     model: "other-model"
  # "🖲️ Tech":
  #   llm:
  #     model: "Qwen/Qwen3-8B"  # 只换模型，key 沿用全局

# 按源路由 LLM：feed 的 site_url 通配符匹配（同 allow_list 语法），优先级高于分组覆盖，
# 未命中则回落到分组覆盖或全局 llm。适合只给某类源（如长字幕的 YouTube）换模型
llm_routes:
  # "https://www.youtube.com/*":
  #   base_url: "https://api.deepseek.com/v1"
  #   api_key: "sk-your-deepseek-key"
  #   model: "deepseek-flash"
  #   timeout: 120
  #   RPM: 60

# YouTube 视频字幕：开启后，youtube.com 的条目会自动拉取视频字幕作为 agent 的
# LLM 输入（字幕本身不写入正文）；正文展示内容由 agent 决定，
# 例如 agents.yml 中的 youtube_digest「视频精读」总结
youtube:
  enabled: true
  # 字幕语言偏好，按顺序回退；都没有时回退到任意可用字幕（优先人工字幕）
  # languages: ["zh-Hans", "zh", "en"]
  # 拉取字幕走代理（容器内无法直连 YouTube 时使用）
  # proxy: "http://host.docker.internal:7890"
  # 单次请求超时（秒），默认 30
  # timeout: 30
  # 注入正文的字幕最大字符数，不限制则省略
  # max_chars: 20000

feeds_status:
  enabled: true
  # feeds_status 与 ai_news 共用同一个 Flask 服务，可复用相同地址
  url: http://miniflux_ai
  # 默认每天 09:00 执行一次
  schedule: "09:00"
